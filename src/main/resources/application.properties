spring.application.name=janawaaz-backend
# 8080 is taken by the Stavya backend, so both can run side by side.
server.port=8081

# Credentials come from the environment or from application-local.properties
# (git-ignored). Run locally with: mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/janawaaz_db}
spring.datasource.username=${DB_USERNAME:janawaaz}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.upload.dir=uploads
# Fills an empty database with sample wards, surveys and complaints for the demo.
app.demo.seed=true
# Public ward reports stay hidden until this many households answered,
# so no individual respondent can be identified.
app.public.min-households=30

logging.level.com.stavya.janawaaz=INFO
